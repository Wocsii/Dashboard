name: Cuadernos y agenda
on:
  push:
    branches: [codex/cuadernos-agenda-kawaii, codex/fix-notebook-drag-delete, main]
  pull_request:
    paths: ['src/features/notes/**', 'src/features/calendar/**', 'tests/e2e/calendar.spec.ts']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.journal.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
